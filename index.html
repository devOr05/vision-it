<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Visión IT | Detector en Tiempo Real</title>

    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- TensorFlow.js and Models -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <div class="logo">Visión IT</div>
                <div class="header-actions">
                    <button id="toggle-camera" class="icon-btn" title="Cambiar Cámara">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"

                            <path d="M3 3v5h5" />
                            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                            <path d="M16 16h5v5" />
                        </svg>
                    </button>
                    <button id="open-settings" class="icon-btn" title="Ajustes">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.72v.18a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="status" class="status">Conectando...</div>
        </header>

        <main class="dashboard-layout demo-mode">
            <!-- Camera Section -->
            <section class="camera-wall">
                <div class="camera-frame">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas"></canvas>
                    <div class="counter-badge">
                        Detectando<span class="dot-ani"></span>
                    </div>
                </div>
            </section>

            <!-- Info & Controls Section -->
            <section class="info-panel demo-hidden">
                <!-- Training and Capture UI removed per Regla de Oro -->

                <!-- Reporting and Log Table removed per Regla de Oro -->
            </section>

            <!-- Detection Feedback Overlay (Demo Mode) -->
            <div id="detection-overlay" class="detection-overlay hidden">
                <div class="overlay-content">
                    <div class="overlay-header">
                        <span class="pulse-icon"></span>
                        <h3>OBJETO DETECTADO</h3>
                    </div>
                    <div class="overlay-body">
                        <div class="info-row">
                            <span class="label">Producto:</span>
                            <span id="overlay-product" class="value">---</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Confianza:</span>
                            <span id="overlay-conf" class="value">0%</span>
                        </div>
                        <div class="info-row status-row">
                            <span id="overlay-status" class="status-msg">Escaneando...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Live Event Feed (Right Sidebar for Demo Mode) -->
            <aside id="live-event-feed" class="live-event-feed">
                <div class="feed-header">
                    <h4>HISTORIAL DE DETECCIONES</h4>
                </div>
                <div id="event-list" class="event-list">
                    <!-- Events will appear here -->
                    <div class="empty-feed-msg">Esperando detecciones...</div>
                </div>
                <div class="feed-footer">
                    <button id="export-pdf-btn" class="btn-accent" style="width: 100%;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="margin-right: 8px;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <line x1="16" y1="13" x2="8" y2="13" />
                            <line x1="16" y1="17" x2="8" y2="17" />
                            <polyline points="10 9 9 9 8 9" />
                        </svg>
                        Generar PDF y Enviar
                    </button>
                </div>
            </aside>
        </main>

        <!-- Settings Drawer -->
        <div id="settings-drawer" class="drawer">
            <div class="drawer-header">
                <h3>Ajustes Técnicos</h3>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>
            <div class="drawer-body">
                <div class="control-group">
                    <label>Sensibilidad de Detección: <span id="conf-val">60</span>%</label>
                    <input type="range" id="conf-slider" min="20" max="95" value="60">
                </div>
                <!-- Voice and Grid removed to keep Beta baseline strictly as requested -->

                <hr>

                <div class="control-group">
                    <label>Configuración Telegram</label>
                    <div class="settings-input-group">
                        <input type="text" id="tg-token" value="8535485891:AAEvAOiKwef-PlGffxwcJubUKYuB819sd90"
                            placeholder="Bot Token" class="settings-input">
                        <button class="btn-edit-setting" title="Editar Token">✏️</button>
                    </div>
                    <div class="settings-input-group" style="margin-top: 8px;">
                        <input type="text" id="tg-chatid" value="1577936762" placeholder="Chat ID"
                            class="settings-input">
                        <button class="btn-edit-setting" title="Editar ID">✏️</button>
                    </div>
                </div>

                <hr>
                <!-- Objeto Objetivo and Modo Enfoque removed per request -->
            </div>

            <div class="settings-actions">
                <!-- Reiniciar and Advanced UI removed per request -->
            </div>
        </div>
    </div>
    </div>

    <script src="script.js"></script>

    <!-- Floating Install Banner -->
    <div id="pwa-install-banner" style="display:none; position:fixed; bottom:20px; left:16px; right:16px; max-width:420px; margin:0 auto; z-index:9999; background:rgba(15,23,42,0.95); border:1px solid rgba(56,189,248,0.4); padding:12px 16px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.5); backdrop-filter:blur(10px); align-items:center; justify-content:space-between; gap:12px; font-family:system-ui, sans-serif;">
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="icons/icon-192.png" alt="Visión IT" style="width:40px; height:40px; border-radius:10px;">
            <div>
                <div style="font-size:14px; font-weight:bold; color:#ffffff; line-height:1.2;">Instalar Visión IT</div>
                <div style="font-size:12px; color:#38bdf8;">Detector IA en tu pantalla</div>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button id="pwa-install-btn" style="background:#0284c7; color:#fff; border:none; padding:8px 14px; border-radius:10px; font-size:12px; font-weight:bold; cursor:pointer;">Instalar</button>
            <button id="pwa-install-close" style="background:transparent; color:#94a3b8; border:none; font-size:16px; cursor:pointer; padding:4px;">✕</button>
        </div>
    </div>

    <!-- PWA Registration & Install Handler -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('Visión IT SW registrado:', reg.scope);
                        reg.update();
                    })
                    .catch(err => console.log('SW falló:', err));
            });
        }

        let deferredPrompt = null;
        const installBanner = document.getElementById('pwa-install-banner');
        const installBtn = document.getElementById('pwa-install-btn');
        const installClose = document.getElementById('pwa-install-close');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBanner) installBanner.style.display = 'flex';
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log('User choice:', outcome);
                    deferredPrompt = null;
                }
                if (installBanner) installBanner.style.display = 'none';
            });
        }

        if (installClose) {
            installClose.addEventListener('click', () => {
                if (installBanner) installBanner.style.display = 'none';
            });
        }

        window.addEventListener('appinstalled', () => {
            if (installBanner) installBanner.style.display = 'none';
        });
    </script>
</body>

</html>
