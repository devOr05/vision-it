<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="65%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="cyberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Solid Background -->
  <rect width="512" height="512" fill="url(#cyberBg)" />

  <!-- Centered Graphic Group at (256, 256) -->
  <g transform="translate(256, 256)">
    <!-- 4 Symmetrical AI Bounding Box / Corner Reticles -->
    <g stroke="url(#neonCyan)" stroke-width="5.5" fill="none" stroke-linecap="round">
      <!-- Top Left -->
      <path d="M -155 -100 L -155 -155 L -100 -155" />
      <!-- Top Right -->
      <path d="M 100 -155 L 155 -155 L 155 -100" />
      <!-- Bottom Left -->
      <path d="M -155 100 L -155 155 L -100 155" />
      <!-- Bottom Right -->
      <path d="M 100 155 L 155 155 L 155 100" />
    </g>

    <!-- Concentric Scanner Rings (100% Centered) -->
    <circle cx="0" cy="0" r="175" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="0" cy="0" r="138" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="0" cy="0" r="92" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" />

    <!-- Central Glowing AI Eye (100% Symmetrical) -->
    <g filter="url(#cyberGlow)">
      <!-- Outer Eye Arch (Top and Bottom curves are exact mirrors) -->
      <path d="M -145 0 C -90 -95 90 -95 145 0 C 90 95 -90 95 -145 0 Z" 
            fill="#030712" stroke="url(#cyanPurple)" stroke-width="7" stroke-linejoin="round" />

      <!-- Iris Circle -->
      <circle cx="0" cy="0" r="62" fill="#020617" stroke="url(#cyanPurple)" stroke-width="5.5" />
      
      <!-- Inner Lens / AI Core -->
      <circle cx="0" cy="0" r="30" fill="url(#neonCyan)" />
      
      <!-- Pupil Glint / Optical Sensor Reflection -->
      <circle cx="-9" cy="-9" r="9" fill="#ffffff" opacity="0.9" />

      <!-- Laser Horizontal Scanline -->
      <line x1="-160" y1="0" x2="160" y2="0" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" stroke-dasharray="8 6" />

      <!-- Symmetrical AI Detection Feature Dots -->
      <circle cx="-50" cy="-35" r="4" fill="#a855f7" />
      <circle cx="50" cy="-35" r="4" fill="#a855f7" />
      <circle cx="-50" cy="35" r="4" fill="#a855f7" />
      <circle cx="50" cy="35" r="4" fill="#a855f7" />
    </g>
  </g>
</svg>